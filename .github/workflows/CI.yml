name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - "**"
  release:
    types:
      - published
  schedule:
    - cron: "0 21 * * *"

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Crystal
        uses: oprypin/install-crystal@v1
        with:
          crystal: 1.22.3

      - name: Install dependencies
        run: shards install

      - name: Check code formatting
        run: crystal tool format --check src test

      - name: Lint
        run: crystal run lib/ameba/src/cli.cr

      - name: Run tests
        run: crystal run test/all_test.cr

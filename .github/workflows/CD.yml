name: CD

on:
  release:
    types:
      - published

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Crystal
        uses: oprypin/install-crystal@v1
        with:
          crystal: 1.18.2

      - name: Install dependencies
        run: shards install

      - name: Run tests
        run: crystal spec
